<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Landing Page - Exact Layout</title>
    <link rel="stylesheet" href="assets/css/gallery-landing.css">
    <style>
        /* Additional demo styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Kay Pho Du', sans-serif;
        }
        
        .demo-header {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
        }
        
        .demo-header h2 {
            margin: 0;
            color: #495057;
            font-size: 18px;
        }
        
        .demo-header p {
            margin: 5px 0 0 0;
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>
<body>


    <div class="gallery-landing-page">
        <!-- Sticky Banner -->
        <div class="sticky-banner">
            <div class="banner-text-container">
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
                <span class="banner-text">NEW SITE // COMING SOON</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Photo Gallery Container -->
            <div class="gallery-container">
                <div class="gallery-border">
                    <div class="gallery-content">
                        <div class="gallery-grid">
                            <!-- Gallery Image 1 -->
                            <div class="gallery-item">
                                <img src="/gallery 1.jpg" alt="Gallery Image 1">
                            </div>
                            
                            <!-- Gallery Image 2 -->
                            <div class="gallery-item">
                                <img src="/gallery 2.jpg" alt="Gallery Image 2">
                            </div>
                            
                            <!-- Gallery Image 3 -->
                            <div class="gallery-item">
                                <img src="/gallery 3.jpg" alt="Gallery Image 3">
                            </div>
                            
                            <!-- Gallery Image 4 -->
                            <div class="gallery-item">
                                <img src="/gallery 4.jpg" alt="Gallery Image 4">
                            </div>
                            
                            <!-- Gallery Image 5 -->
                            <div class="gallery-item">
                                <img src="/gallery 5.jpg" alt="Gallery Image 5">
                            </div>
                            
                            <!-- Gallery Image 6 -->
                            <div class="gallery-item">
                                <img src="/gallery 6.jpg" alt="Gallery Image 6">
                            </div>
                            
                            <!-- Gallery Image 7 -->
                            <div class="gallery-item">
                                <img src="/gallery 7.jpg" alt="Gallery Image 7">
                            </div>
                            
                            <!-- Gallery Image 8 -->
                            <div class="gallery-item">
                                <img src="/gallery 8.jpg" alt="Gallery Image 8">
                            </div>
                            
                            <!-- Gallery Image 9 -->
                            <div class="gallery-item">
                                <img src="/gallery 9.jpg" alt="Gallery Image 9">
                            </div>
                            
                            <!-- Gallery Image 10 -->
                            <div class="gallery-item">
                                <img src="/gallery 10.jpg" alt="Gallery Image 10">
                            </div>
                            
                            <!-- Gallery Image 11 -->
                            <div class="gallery-item">
                                <img src="/gallery 11.jpg" alt="Gallery Image 11">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Instagram Link -->
            <div class="instagram-link">
                <a href="https://www.instagram.com/avery.b33/" target="_blank">
                    @https://www.instagram.com/avery.b33/
                </a>
            </div>
        </div>

        <!-- averyfinallogo.svg logo in bottom right corner -->
        <div class="bottom-right-image">
            <img src="/averyfinallogo.svg" alt="Logo" onerror="this.style.display='none'">
        </div>
    </div>
</body>
</html>
